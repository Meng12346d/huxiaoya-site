<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>湖小鸭项目</title>
<meta name="description" content="湖小鸭项目官方网站（建设中）">
<style>
  :root{
    --ink:#12232e; --ink-soft:#4a6474; --line:rgba(18,35,46,.12);
    --lake1:#eaf3f7; --lake2:#cfe3ec; --accent:#2f7d95; --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#f7fbfd 0%,var(--lake1) 45%,var(--lake2) 100%);
    display:flex;align-items:center;justify-content:center;padding:32px 20px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    position:relative;width:100%;max-width:620px;background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:48px 40px 40px;
    box-shadow:0 24px 60px -30px rgba(18,35,46,.28),0 2px 6px rgba(18,35,46,.04);
    text-align:center;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0 0 auto;height:4px;
    background:linear-gradient(90deg,var(--accent),#6fb3c4 55%,#bfe0ea);
  }
  .mark{width:96px;height:96px;margin:0 auto 22px;display:block}
  h1{font-size:30px;letter-spacing:.5px;font-weight:700;line-height:1.3}
  .sub{margin-top:10px;color:var(--ink-soft);font-size:15px;line-height:1.7}
  .pill{
    display:inline-flex;align-items:center;gap:8px;margin-top:26px;
    padding:8px 16px;border-radius:999px;font-size:13px;
    background:#eef7f4;color:#1f6b4f;border:1px solid #cfe9dd;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#25a06a;box-shadow:0 0 0 3px rgba(37,160,106,.16)}
  .meta{
    margin-top:34px;padding-top:24px;border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:center;
  }
  .meta div span{display:block}
  .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8aa2af;margin-bottom:6px}
  .v{font-size:13px;color:var(--ink);font-weight:600;word-break:break-all}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  @media (max-width:520px){
    .card{padding:36px 22px 30px;border-radius:16px}
    h1{font-size:24px}
    .meta{grid-template-columns:1fr;gap:14px}
    .mark{width:80px;height:80px}
  }
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <circle cx="60" cy="60" r="58" fill="#eaf3f7"/>
      <path d="M22 78c8 0 8 6 16 6s8-6 16-6 8 6 16 6 8-6 16-6" stroke="#8fc0cf" stroke-width="3" stroke-linecap="round"/>
      <path d="M30 88c8 0 8 6 16 6s8-6 16-6 8 6 16 6 8-6 16-6" stroke="#bfdde6" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="62" cy="62" rx="24" ry="17" fill="#ffffff" stroke="#2f7d95" stroke-width="2.5"/>
      <circle cx="47" cy="45" r="11" fill="#ffffff" stroke="#2f7d95" stroke-width="2.5"/>
      <circle cx="44.5" cy="43" r="2" fill="#2f7d95"/>
      <path d="M36 46l-9 3 9 3z" fill="#e8a33d"/>
      <path d="M78 56c10-5 16-1 16-1" stroke="#2f7d95" stroke-width="2.5" stroke-linecap="round"/>
    </svg>

    <h1>湖小鸭项目</h1>
    <p class="sub">站点已完成永久托管部署。<br>正式内容正在接入，页面即将上线。</p>

    <div class="pill"><i class="dot"></i>GitHub Pages · 已上线</div>

    <section class="meta">
      <div><span class="k">托管</span><span class="v">GitHub Pages</span></div>
      <div><span class="k">状态</span><span class="v">占位页</span></div>
      <div><span class="k">仓库</span><span class="v"><a href="https://github.com/Meng12346d/huxiaoya-site">huxiaoya-site</a></span></div>
    </section>
  </main>
</body>
</html>
